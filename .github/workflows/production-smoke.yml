name: 公開サイトスモークテスト

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

jobs:
  production-smoke:
    name: GitHub Pagesの主要動線を確認
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        working-directory: frontend
        run: npm ci

      - name: Chromiumをインストール
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 公開サイトを確認
        working-directory: frontend
        env:
          CI: "true"
          PRODUCTION_SMOKE: "1"
          PLAYWRIGHT_BASE_URL: "https://kazuki-shimi620.github.io/map-lgb-fond/"
        run: npm run test:e2e:production

      - name: Playwrightレポートをアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
